<!-- 所有活动页面 -->
<div class="page" id="campaigns-page">
    <div class="page-header">
        <div class="back-button" onclick="goBack()">
            <span class="material-icons">arrow_back</span>
        </div>
        <div class="page-title">门店活动</div>
    </div>

    <div class="campaigns-content">
        <div id="all-campaigns-list" class="all-campaigns-list">
            <!-- 活动列表将通过JS动态加载 -->
            <div class="loading-indicator">加载活动信息...</div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadAllCampaigns();
});

// 加载所有活动
function loadAllCampaigns() {
    const campaignsList = document.getElementById('all-campaigns-list');
    
    // 从JSON文件加载活动数据
    fetch('data/store_campaigns.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('无法加载活动数据');
            }
            return response.json();
        })
        .then(data => {
            // 清空加载指示器
            campaignsList.innerHTML = '';
            
            // 显示所有活动
            if (data.activities && data.activities.length > 0) {
                data.activities.forEach(activity => {
                    const campaignItem = document.createElement('div');
                    campaignItem.className = 'campaign-list-item';
                    campaignItem.onclick = function() {
                        loadCampaignDetail(activity.id);
                    };
                    
                    const title = document.createElement('div');
                    title.className = 'campaign-list-title';
                    title.textContent = activity.content.title;
                    
                    const time = document.createElement('div');
                    time.className = 'campaign-list-time';
                    time.textContent = activity.content.period || activity.content.time || '';
                    
                    const description = document.createElement('div');
                    description.className = 'campaign-list-description';
                    // 取第一条福利作为描述
                    if (activity.content.benefits && activity.content.benefits.length > 0) {
                        description.textContent = activity.content.benefits[0];
                    }
                    
                    const arrowIcon = document.createElement('span');
                    arrowIcon.className = 'material-icons arrow-icon';
                    arrowIcon.textContent = 'arrow_forward_ios';
                    
                    campaignItem.appendChild(title);
                    campaignItem.appendChild(time);
                    campaignItem.appendChild(description);
                    campaignItem.appendChild(arrowIcon);
                    
                    campaignsList.appendChild(campaignItem);
                });
            } else {
                // 没有活动数据
                campaignsList.innerHTML = '<div class="no-data">暂无活动信息</div>';
            }
        })
        .catch(error => {
            console.error('加载活动数据失败:', error);
            campaignsList.innerHTML = '<div class="error-message">加载活动数据失败</div>';
        });
}

// 加载活动详情页
function loadCampaignDetail(campaignId) {
    window.currentCampaignId = campaignId;
    navigateTo('campaign-detail');
}
</script>
