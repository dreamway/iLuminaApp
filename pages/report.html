<!-- 报告页面 -->
<div class="page" id="report-page">
    <div class="page-header">
        <div class="page-title">检测报告</div>
    </div>

    <!-- 报告列表 -->
    <div class="card">
        <div class="section-title">最近检测报告</div>
        <div class="report-list">
            <div class="report-item" onclick="viewReport('report1')">
                <div class="report-info">
                    <div class="report-name">陈先生 - 眼部健康检测</div>
                    <div class="report-date">2025-03-15</div>
                </div>
                <div class="report-score">
                    <div class="score-circle">78</div>
                    <div class="score-text">健康评分</div>
                </div>
            </div>
            <div class="report-item" onclick="viewReport('report2')">
                <div class="report-info">
                    <div class="report-name">李先生 - 眼部健康检测</div>
                    <div class="report-date">2025-03-10</div>
                </div>
                <div class="report-score">
                    <div class="score-circle">65</div>
                    <div class="score-text">健康评分</div>
                </div>
            </div>
            <div class="report-item" onclick="viewReport('report3')">
                <div class="report-info">
                    <div class="report-name">王女士 - 眼部健康检测</div>
                    <div class="report-date">2025-02-25</div>
                </div>
                <div class="report-score">
                    <div class="score-circle">82</div>
                    <div class="score-text">健康评分</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 报告详情 -->
    <div class="report-detail" id="report1-detail" style="display: none;">
        <div class="report-header">
            <div class="report-customer-info">
                <div class="report-customer-item">
                    <div class="report-customer-label">姓名</div>
                    <div class="report-customer-value">陈先生</div>
                </div>
                <div class="report-customer-item">
                    <div class="report-customer-label">检测日期</div>
                    <div class="report-customer-value">2025-03-15</div>
                </div>
                <div class="report-customer-item">
                    <div class="report-customer-label">年龄</div>
                    <div class="report-customer-value">35岁</div>
                </div>
                <div class="report-customer-item">
                    <div class="report-customer-label">性别</div>
                    <div class="report-customer-value">男</div>
                </div>
            </div>
            <div class="report-score-large">
                <div class="score-circle-large">78</div>
                <div class="score-text-large">健康评分</div>
            </div>
        </div>

        <div class="report-section">
            <div class="report-section-title">眼部问题分析</div>
            <div class="problem-list">
                <div class="problem-item">
                    <div class="problem-title">眼疲劳</div>
                    <div class="problem-description">长时间用眼，眼部肌肉疲劳，血液循环不畅</div>
                </div>
                <div class="problem-item">
                    <div class="problem-title">轻度干眼</div>
                    <div class="problem-description">泪膜稳定性下降，泪液分泌不足</div>
                </div>
            </div>
        </div>

        <div class="report-section">
            <div class="report-section-title">五维度评分</div>
            <div id="radar-chart" style="width: 100%; height: 300px;"></div>
        </div>

        <div class="action-buttons">
            <button class="button" onclick="viewRecommendation('report1')">查看改善方案</button>
            <button class="button secondary" onclick="shareReport('report1')">分享报告</button>
        </div>
    </div>
</div>

<script>
function viewReport(reportId) {
    console.log(`查看报告: ${reportId}`);
    // 这里可以添加显示报告详情的逻辑
}

function viewRecommendation(reportId) {
    console.log(`查看改善方案: ${reportId}`);
    // 这里可以添加查看推荐方案的逻辑
}

function shareReport(reportId) {
    console.log(`分享报告: ${reportId}`);
    // 这里可以添加分享报告的逻辑
}

// 使用ECharts绘制雷达图
function initRadarChart() {
    // 模拟数据
    const chartDom = document.getElementById('radar-chart');
    if (chartDom) {
        const myChart = echarts.init(chartDom);
        const option = {
            radar: {
                indicator: [
                    { name: '视力健康', max: 100 },
                    { name: '眼表健康', max: 100 },
                    { name: '眼肌健康', max: 100 },
                    { name: '眼压健康', max: 100 },
                    { name: '眼周健康', max: 100 }
                ]
            },
            series: [{
                type: 'radar',
                data: [
                    {
                        value: [80, 70, 75, 90, 75],
                        name: '健康评分',
                        areaStyle: {
                            color: 'rgba(33, 150, 243, 0.3)'
                        },
                        lineStyle: {
                            color: '#2196F3'
                        }
                    }
                ]
            }]
        };
        myChart.setOption(option);
    }
}

// 页面加载完成后初始化图表
document.addEventListener('DOMContentLoaded', function() {
    initRadarChart();
});
</script>
