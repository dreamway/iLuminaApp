<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美睛美科 - 眼部检测系统V4</title>
    <!-- 引入字体和图标 -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- 引入 ECharts -->
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.2.2/echarts.min.js"></script>
    <!-- 样式文件 -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <style>
        /* 基本样式，确保页面有内容 */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <!-- 页面容器 -->
    <div class="app-container">
        <!-- 公共头部 -->
        <div id="header">
            <!-- 头部内容将由JS加载 -->
        </div>

        <!-- 页面内容区域 -->
        <div class="content-area" id="content">
            <!-- 加载中占位 -->
            <div class="loading-container">
                <span class="material-icons loading-icon">hourglass_top</span>
                <p>加载中...</p>
            </div>
        </div>
    
        <!-- 公共底部 -->
        <div id="footer">
            <!-- 底部导航将由JS加载 -->
        </div>
    </div>

    <!-- 主页面脚本 -->
    <script src="scripts/main.js"></script>
    <script>
        // 预定义一个基本的首页初始化函数，确保在home.html加载前就存在
        window.initHomePage = function() {
            console.log('使用预定义的首页初始化函数');
            
            // 延迟等待DOM加载完成
            setTimeout(() => {
                // 初始化轮播图等元素
                const carouselContainer = document.querySelector('.carousel-container');
                if (carouselContainer) {
                    console.log('找到轮播容器，初始化轮播图');
                    // 使用主js中的后备初始化函数
                    if (typeof initializeFallbackCarousel === 'function') {
                        initializeFallbackCarousel();
                    }
                }
                
                // 初始化其他元素...
            }, 100);
        };
        
        // 页面加载完成时执行
        window.addEventListener('load', function() {
            console.log("页面完全加载完成");
            
            // 确保主要函数存在
            if (typeof navigateTo !== 'function') {
                console.error('找不到导航函数，可能是main.js没有正确加载');
                document.getElementById('content').innerHTML = '<div class="error-message">系统初始化失败，请刷新页面</div>';
                return;
            }
            
            // 设置导航栏点击事件
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                const pageId = item.getAttribute('data-page');
                if (pageId) {
                    item.addEventListener('click', function() {
                        navigateTo(pageId);
                    });
                }
            });

            // 手动加载头部和底部
            loadComponents(function() {
                // 组件加载完成后导航到首页
                navigateTo('home');
            });
        });

        // 加载基础组件
        function loadComponents(callback) {
            // 加载底部导航
            fetch('components/footer.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer').innerHTML = html;
                    
                    // 加载头部
                    return fetch('components/header.html');
                })
                .then(response => response.text())
                .then(html => {
                    document.getElementById('header').innerHTML = html;
                    
                    // 所有组件加载完成，执行回调
                    if (typeof callback === 'function') {
                        callback();
                    }
                })
                .catch(error => {
                    console.error('加载基础组件失败:', error);
                    document.getElementById('content').innerHTML = '<div class="error-message">加载基础组件失败，请刷新页面</div>';
                });
        }
    </script>
</body>

</html>
